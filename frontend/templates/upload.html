<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Extracción de etiquetas de una imagen</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
  <div class="loader-container">
        <div class="loader"></div>
    </div>
  <div class="container">
    <div class="row">
        <br>
        <h1>Seleccione el archivo</h1>
        <form id="formularioAnalisis" enctype="multipart/form-data">
          <input type="file" name="imagen" accept=".jpg,.jpeg,.png,.gif,.bmp,.tif,.tiff" required>
          <br>
          <button type="submit"  class="btn btn-primary">Obtener etiquetas</button>
        </form>
    </div>    
  </div>  
  <script src="{{url_for('static', filename='js/upload.js')}}"></script>
</body>
</html>
